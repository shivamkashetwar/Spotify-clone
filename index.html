
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utility.css">

    <title>Spotify Clone</title>
</head>

<body>
    <div class="container flex bg-black">

        <!-- Left Sidebar -->
        <div class="left bg-black">

            <!-- Home Section -->
            <div class="home bg-gray rounded m1 p1">

                <div class="logo">
                    <img class="invert" src="logo.svg" alt="Spotify logo">
                </div>

                <ul>
                    <li>
                        <img class="invert" src="home.svg" alt="Home">
                        <span>Home</span>
                    </li>

                    <li>
                        <img class="invert" src="search.svg" alt="Search">
                        <span>Search</span>
                    </li>
                </ul>

            </div>

            <!-- Library Section -->
            <div class="library bg-gray rounded m1 p1">

                <div class="heading">
                    <img class="invert" src="playlist.svg" alt="Your Library">

                    <h2>Your Library</h2>
                </div>
                 <div class="footer">

                
                    <a href="https://www.spotify.com/jp/legal/">
                        <span>Legal</span>
                    </a>


                
                    <a href="https://www.spotify.com/jp/privacy/">
                        <span>Privacy Center</span>
                    </a>
            

            
                    <a href="https://www.spotify.com/jp/legal/privacy-policy/">
                        <span>Privacy Policy</span>
                    </a>
        

                
                    <a href="https://www.spotify.com/jp/legal/cookies-policy/">
                        <span>Cookies</span>
                    </a>
        

            
                    <a href="https://www.spotify.com/jp/legal/privacy-policy/#s3">
                        <span>About Ads</span>
                    </a>
        


                    <a href="https://www.spotify.com/jp/accessibility/">
                        <span>Accessibility</span>
                    </a>

            </div>

        </div>

            </div>

            <!-- Footer -->
           

        <!-- Right Content -->
        <div class="right  bg-gray rounded  p1">
            <div class="header">
                <div class="nev">
                     <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M15 6L9.70711 11.2929C9.37377 11.6262 9.20711 11.7929 9.20711 12C9.20711 12.2071 9.37377 12.3738 9.70711 12.7071L15 18"
                                stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M9 18L14.2929 12.7071C14.6262 12.3738 14.7929 12.2071 14.7929 12C14.7929 11.7929 14.6262 11.6262 14.2929 11.2929L9 6"
                                stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>

                          </div>
                    <div class="button">
                        <button>log in </button>
                        <button>sing up</button>
                    </div>
            </div>

            <div class="spotifyplaylist">
                <h1>Spotify Playlist</h1>
                 <div class="cardcontainer">
                    <div class="card">
                       <img
                           src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSsr9KiJkuQvfVEBWFjzqCHiBL_weKQVn8lO_r05Ig_vg&s=10" >
                        <h2>Happy Hits!</h2>
                        <p>Hist to boost your mood and fill you with happiness!</p>
                    </div>
                    <div class="card">
                       <img
                           src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSsr9KiJkuQvfVEBWFjzqCHiBL_weKQVn8lO_r05Ig_vg&s=10" >
                        <h2>Happy Hits!</h2>
                        <p>Hist to boost your mood and fill you with happiness!</p>
                    </div>
                 </div>
            </div>
        </div>

    </div>
</body>
</html>
