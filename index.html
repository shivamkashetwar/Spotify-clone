<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - Web Player: Music for everyone</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Icon sprite: all control icons live here, so no extra files are needed -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="i-play" viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z" fill="currentColor"/></symbol>
        <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z" fill="currentColor"/></symbol>
        <symbol id="i-prev" viewBox="0 0 24 24"><path d="M19 5v14L8 12zM5 5h2v14H5z" fill="currentColor"/></symbol>
        <symbol id="i-next" viewBox="0 0 24 24"><path d="M5 5v14l11-7zM17 5h2v14h-2z" fill="currentColor"/></symbol>
        <symbol id="i-volume" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9zM15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
        <symbol id="i-mute" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
        <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
        <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    </svg>

    <div class="container">
        <aside class="left" id="sidebar">
            <button class="icon-btn close" id="closeSidebar" aria-label="Close menu">
                <svg width="28" height="28"><use href="#i-close"/></svg>
            </button>

            <nav class="home panel">
                <div class="logo"><img width="40" class="invert" src="img/logo.svg" alt="Spotify"></div>
                <ul>
                    <li><img width="24" class="invert" src="img/home.svg" alt="">Home</li>
                    <li><img width="24" class="invert" src="img/search.svg" alt="">Search</li>
                </ul>
            </nav>

            <section class="library panel">
                <div class="heading">
                    <img class="invert" src="img/playlist.svg" alt="">
                    <h2>Your Library</h2>
                </div>

                <div class="songList">
                    <ul id="songList"></ul>
                </div>

                <div class="footer">
                    <a href="https://www.spotify.com/in-en/legal/" target="_blank" rel="noopener">Legal</a>
                    <a href="https://www.spotify.com/in-en/privacy/" target="_blank" rel="noopener">Privacy Center</a>
                    <a href="https://www.spotify.com/in-en/legal/privacy-policy/" target="_blank" rel="noopener">Privacy Policy</a>
                    <a href="https://www.spotify.com/in-en/legal/cookies-policy/" target="_blank" rel="noopener">Cookies</a>
                    <a href="https://www.spotify.com/in-en/accessibility/" target="_blank" rel="noopener">Accessibility</a>
                </div>
            </section>
        </aside>

        <main class="right panel">
            <header class="header">
                <div class="nav">
                    <button class="icon-btn hamburger" id="openSidebar" aria-label="Open menu">
                        <svg width="32" height="32"><use href="#i-menu"/></svg>
                    </button>
                </div>
                <div class="buttons">
                    <button class="signupbtn">Sign up</button>
                    <button class="loginbtn">Log in</button>
                </div>
            </header>

            <section class="spotifyPlaylists">
                <h1>Spotify Playlists</h1>
                <div class="cardContainer" id="cardContainer"></div>
            </section>
        </main>
    </div>

    <div class="playbar" role="region" aria-label="Player">
        <div class="seekbar" id="seekbar" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
            <div class="progress" id="progress"></div>
            <div class="circle" id="circle"></div>
        </div>

        <div class="abovebar">
            <div class="songinfo" id="songinfo">Pick a song to start</div>

            <div class="songbuttons">
                <button class="icon-btn" id="previous" aria-label="Previous song"><svg width="32" height="32"><use href="#i-prev"/></svg></button>
                <button class="icon-btn" id="play" aria-label="Play"><svg width="40" height="40"><use id="playIcon" href="#i-play"/></svg></button>
                <button class="icon-btn" id="next" aria-label="Next song"><svg width="32" height="32"><use href="#i-next"/></svg></button>
            </div>

            <div class="timevol">
                <div class="songtime" id="songtime">00:00 / 00:00</div>
                <div class="volume">
                    <button class="icon-btn" id="muteBtn" aria-label="Mute"><svg width="24" height="24"><use id="volumeIcon" href="#i-volume"/></svg></button>
                    <input type="range" id="volume" min="0" max="100" value="50" aria-label="Volume">
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
